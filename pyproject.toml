# pyproject.toml

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "odocxify"
version = "0.1.0"
description = "An intelligent, AI-powered documentation generator for Python."
authors = [
    {name = "Shridhar Mandrekar", email = "shridharmandrekar118@gmail.com"},
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9,<4.0"
dynamic = ["dependencies"]
keywords = ["documentation", "generator", "ai", "docstrings", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Documentation",
]

[project.urls]
Homepage = "https://github.com/Shridharrr/odoc"
Repository = "https://github.com/Shridharrr/odoc"

[project.scripts]
odoc = "odocxify.main:app"

# --- Poetry-specific configuration remains below ---

[tool.poetry]
packages = [{include = "odocxify", from = "src"}]
include = [{path = "templates/**/*.j2", format = ["sdist", "wheel"]}]

[tool.poetry.dependencies]
python = "^3.9"
typer = {extras = ["all"], version = "^0.9.0"}
jinja2 = "^3.1.6"
python-dotenv = "^1.1.1"
google-generativeai = "^0.8.5"
tomli = {version = "^2.0.1", python = "<3.11"}
mkdocs = "^1.6.0"
mkdocs-material = "^9.0.0"
mkdocs-awesome-pages-plugin = "^2.9.1"

[tool.odoc]
exclude = [
    "tests/*",
    "ai_test.py"
]
[tool.poetry.group.dev.dependencies]
pytest = ">=7.4,<9.0"
